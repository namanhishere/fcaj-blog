<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 650" font-family="Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#FF9900"/></marker>
    <filter id="shadow"><feDropShadow dx="1" dy="1" stdDeviation="1.5" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="950" height="650" fill="#F4F7FB" rx="10"/>

  <!-- Title -->
  <text x="475" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#232F3E">CDK Project Structure — lẩu/Place</text>
  <line x1="200" y1="42" x2="750" y2="42" stroke="#FF9900" stroke-width="2"/>

  <!-- Central AwsplaceStack -->
  <rect x="340" y="58" width="270" height="52" rx="6" fill="url(#cGrad)" stroke="#D47500" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="475" y="80" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">AWS CDK — AwsplaceStack</text>
  <text x="475" y="99" text-anchor="middle" font-size="11" fill="#FFF3E0">Main Stack Orchestrator · ap-southeast-1</text>

  <!-- Row 1 -->
  <g filter="url(#shadow)">
    <rect x="30" y="150" width="155" height="48" rx="5" fill="#8C4FFF"/><text x="108" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">☁ VPC</text><text x="108" y="190" text-anchor="middle" font-size="9" fill="#E8D5FF">2 AZ · Public Subnets</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="210" y="150" width="155" height="48" rx="5" fill="#DD344C"/><text x="288" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">🔑 IAM</text><text x="288" y="190" text-anchor="middle" font-size="9" fill="#FFD5DA">3 IAM Roles</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="390" y="150" width="155" height="48" rx="5" fill="#3F8624"/><text x="468" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">🗄 DynamoDB</text><text x="468" y="190" text-anchor="middle" font-size="9" fill="#D5F5BB">4 TableV2 Tables</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="570" y="150" width="155" height="48" rx="5" fill="#C925D1"/><text x="648" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">📦 ECR</text><text x="648" y="190" text-anchor="middle" font-size="9" fill="#F5D5FF">Image Registry</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="750" y="150" width="170" height="48" rx="5" fill="#E8712B"/><text x="835" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">🪣 S3 Storage</text><text x="835" y="190" text-anchor="middle" font-size="9" fill="#FFE0C8">Canvas + Exports</text>
  </g>

  <!-- Row 2 -->
  <g filter="url(#shadow)">
    <rect x="70" y="238" width="155" height="48" rx="5" fill="#2C98A0"/><text x="148" y="260" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">🌐 Amplify</text><text x="148" y="278" text-anchor="middle" font-size="9" fill="#C8F5F8">Frontend Hosting</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="255" y="238" width="155" height="48" rx="5" fill="#E65100"/><text x="333" y="260" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">λ Lambda</text><text x="333" y="278" text-anchor="middle" font-size="9" fill="#FFCC80">Auth + Admin Proxy</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="440" y="238" width="155" height="48" rx="5" fill="#7D2615"/><text x="518" y="260" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">⚡ API Gateway</text><text x="518" y="278" text-anchor="middle" font-size="9" fill="#F5D8D0">HTTP API v2</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="625" y="238" width="155" height="48" rx="5" fill="#D13212"/><text x="703" y="260" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">🐳 ECS</text><text x="703" y="278" text-anchor="middle" font-size="9" fill="#FFD2CC">Fargate + ALB</text>
  </g>

  <!-- Row 3 -->
  <g filter="url(#shadow)">
    <rect x="150" y="326" width="155" height="48" rx="5" fill="#5A6C7D"/><text x="228" y="348" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">🌍 Route 53</text><text x="228" y="366" text-anchor="middle" font-size="9" fill="#D5E0E8">DNS + ACM Cert</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="340" y="326" width="155" height="48" rx="5" fill="#1668B5"/><text x="418" y="348" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">🗂 RaftDB App</text><text x="418" y="366" text-anchor="middle" font-size="9" fill="#B5D5F5">EFS + S3 Snapshots</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="530" y="326" width="155" height="48" rx="5" fill="#146EB4"/><text x="608" y="348" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">🧪 RaftDB Staging</text><text x="608" y="366" text-anchor="middle" font-size="9" fill="#B5D5F5">Qualification Stack</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="720" y="326" width="155" height="48" rx="5" fill="#1E73BE"/><text x="798" y="348" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">📊 Dashboard</text><text x="798" y="366" text-anchor="middle" font-size="9" fill="#B5D5F5">CloudWatch Metrics</text>
  </g>

  <!-- Arrows from stack center to all modules -->
  <g stroke="#FF9900" stroke-width="1.2" opacity="0.7">
    <line x1="360" y1="110" x2="108" y2="148" marker-end="url(#arr)"/>
    <line x1="410" y1="110" x2="288" y2="148" marker-end="url(#arr)"/>
    <line x1="475" y1="110" x2="468" y2="148" marker-end="url(#arr)"/>
    <line x1="520" y1="110" x2="648" y2="148" marker-end="url(#arr)"/>
    <line x1="580" y1="110" x2="835" y2="148" marker-end="url(#arr)"/>
    <line x1="380" y1="110" x2="148" y2="236" marker-end="url(#arr)"/>
    <line x1="450" y1="110" x2="333" y2="236" marker-end="url(#arr)"/>
    <line x1="475" y1="110" x2="518" y2="236" marker-end="url(#arr)"/>
    <line x1="515" y1="110" x2="703" y2="236" marker-end="url(#arr)"/>
    <line x1="420" y1="110" x2="228" y2="324" marker-end="url(#arr)"/>
    <line x1="460" y1="110" x2="418" y2="324" marker-end="url(#arr)"/>
    <line x1="510" y1="110" x2="608" y2="324" marker-end="url(#arr)"/>
    <line x1="570" y1="110" x2="798" y2="324" marker-end="url(#arr)"/>
  </g>

  <!-- Principles -->
  <rect x="30" y="405" width="890" height="95" rx="6" fill="#FFF" stroke="#D5DBDB" stroke-width="1"/>
  <text x="475" y="428" text-anchor="middle" font-size="14" font-weight="bold" fill="#232F3E">Key Design Principles</text>
  <g font-size="10" fill="#545B64">
    <circle cx="55" cy="448" r="3" fill="#8C4FFF"/><text x="65" y="452">Construct factories: each module exports create*() functions</text>
    <circle cx="55" cy="468" r="3" fill="#8C4FFF"/><text x="65" y="472">Strict TypeScript: strict, declaration, esModuleInterop all enabled</text>
    <circle cx="55" cy="488" r="3" fill="#8C4FFF"/><text x="65" y="492">Output everything: all resources exposed as CfnOutput for CI/CD</text>
    <circle cx="475" cy="448" r="3" fill="#8C4FFF"/><text x="485" y="452">S3 import-only: buckets imported by name, survive cdk destroy</text>
    <circle cx="475" cy="468" r="3" fill="#8C4FFF"/><text x="485" y="472">No raw ARNs: use .fromLookup(), .fromBucketName(), .fromTableArn()</text>
    <circle cx="475" cy="488" r="3" fill="#8C4FFF"/><text x="485" y="492">Retained resources: ECR + Secrets Manager survive cdk destroy</text>
    <circle cx="730" cy="448" r="3" fill="#8C4FFF"/><text x="740" y="452">Region: ap-southeast-1 (Singapore)</text>
    <circle cx="730" cy="468" r="3" fill="#8C4FFF"/><text x="740" y="472">15 TypeScript modules → 1 CloudFormation stack</text>
    <circle cx="730" cy="488" r="3" fill="#8C4FFF"/><text x="740" y="492">CDK App → AwsplaceStack → RaftDbStagingStack (conditional)</text>
  </g>

  <!-- Deployment -->
  <rect x="30" y="515" width="890" height="120" rx="6" fill="#FFF8E8" stroke="#FFB300" stroke-width="1"/>
  <text x="475" y="538" text-anchor="middle" font-size="14" font-weight="bold" fill="#E67E00">🚀 Deployment &amp; Infrastructure Summary</text>

  <rect x="50" y="550" width="260" height="28" rx="4" fill="#232F3E"/><text x="180" y="569" text-anchor="middle" font-size="11" font-weight="bold" fill="#FF9900">Entry Point &amp; Main Stack</text>
  <rect x="330" y="550" width="280" height="28" rx="4" fill="#232F3E"/><text x="470" y="569" text-anchor="middle" font-size="11" font-weight="bold" fill="#FF9900">10+ Infrastructure Modules</text>
  <rect x="630" y="550" width="270" height="28" rx="4" fill="#232F3E"/><text x="765" y="569" text-anchor="middle" font-size="11" font-weight="bold" fill="#FF9900">18 CloudFormation Outputs</text>

  <text x="180" y="605" text-anchor="middle" font-size="10" fill="#545B64">CDK App → AwsplaceStack</text>
  <text x="470" y="605" text-anchor="middle" font-size="10" fill="#545B64">VPC → DB → ECR → Storage → IAM →</text>
  <text x="765" y="605" text-anchor="middle" font-size="10" fill="#545B64">VpcId, EcsRepositoryUri, EcsClusterName,</text>
  <text x="180" y="620" text-anchor="middle" font-size="10" fill="#545B64">RaftDbStagingStack (conditional)</text>
  <text x="470" y="620" text-anchor="middle" font-size="10" fill="#545B64">RaftDB → Route53 → Lambda → API GW →</text>
  <text x="765" y="620" text-anchor="middle" font-size="10" fill="#545B64">Amplify + ECS (all resource ARNs)</text>
  <text x="470" y="633" text-anchor="middle" font-size="10" fill="#545B64">Amplify → ECS</text>
</svg>
